name: Full System Deploy to Staging
on:
  push:
    branches:
      - staging
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: install dependencies
        run: npm ci
      - name: install dependencies functions
        run: cd infra/functions && npm ci
      - name: install depencendies web
        run: cd web && npm ci
      - name: Test functions
        run: cd infra/functions && npm test
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_SMALL_APPS_STAGING }}
      - name: Terraform Init & Apply
        run: |
          npm run terraform:init:staging
          npm run terraform:apply:staging
      - name: Inject configurations from GitHub Secrets
        env:
          WEB_ENV: ${{ secrets.WEB_ENV_STAGING }}
          FUNCTIONS_ENV: ${{ secrets.FUNCTIONS_ENV_STAGING }}
        run: |
          # Web: Export Next.js public variables for CI build validation.
          # App Hosting rollouts use backend environment variables and apphosting yaml.
          echo "$WEB_ENV" | grep -v '^#' | grep -v '^[[:space:]]*$' >> $GITHUB_ENV

          # Functions: Write to .env so Cloud Functions reads them at runtime
          echo "$FUNCTIONS_ENV" > infra/functions/.env
          echo "" >> infra/functions/.env
          echo "# Cloud Tasks — injected by CI" >> infra/functions/.env
          echo "CLOUD_TASKS_PROJECT=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_SMALL_APPS_STAGING }}' | jq -r .project_id)" >> infra/functions/.env
          echo "CLOUD_TASKS_HANDLER_URL=https://us-central1-$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_SMALL_APPS_STAGING }}' | jq -r .project_id).cloudfunctions.net" >> infra/functions/.env
      - name: Build web
        run: cd web && npm run build
      - name: deploy
        run: npm run firebase:deploy:staging
